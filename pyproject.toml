[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "panelcast"
version = "0.1.0"
description = "Alternative-data revenue nowcasting lakehouse: card-panel ingestion, merchant entity resolution, anomaly detection, fiscal-calendar-aligned nowcasts, and a LangGraph analyst agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Matthew Hermosura" }]
# Spark is deliberately NOT a core dependency: Databricks serverless ships its own (Spark Connect) and
# must not get a second pyspark from pip. Local runs install the `local` extra.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2,<3",
    "pyarrow>=15",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "rapidfuzz>=3.6",
    "pyyaml>=6",
    "requests>=2.31",
    "matplotlib>=3.8",
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-anthropic>=1.0",
]

[project.urls]
Repository = "https://github.com/HermosuraM/panelcast"
Documentation = "https://github.com/HermosuraM/panelcast/blob/main/docs/METHODOLOGY.md"

[project.optional-dependencies]
local = ["pyspark>=4.0", "delta-spark>=4.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
panelcast = "panelcast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
panelcast = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "spark: needs a local SparkSession (JVM)",
    "e2e: runs the whole pipeline at toy scale",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".scratch", "lakehouse", ".jars"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PD", "NPY"]
# .at/.iat scalar access and pivot are idiomatic here; ternaries are not always clearer
ignore = ["PD008", "PD009", "PD010", "PD011", "SIM108", "B008"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["E402", "F821", "I001"]
