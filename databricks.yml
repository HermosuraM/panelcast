# Declarative Automation Bundle (formerly Databricks Asset Bundle) for PanelCast.
# Targets Databricks Free Edition / any workspace with serverless jobs and Unity Catalog.
#   databricks bundle validate
#   databricks bundle deploy
#   databricks bundle run panelcast_pipeline
bundle:
  name: panelcast

include:
  - resources/*.yml

artifacts:
  panelcast_wheel:
    type: whl
    build: python -m pip wheel --no-deps --wheel-dir dist .
    path: .

variables:
  scale:
    description: Panel size multiplier for the simulation (1.0 = 10,000 panelists, ~10M transactions)
    default: "1.0"

targets:
  dev:
    mode: development
    default: true
