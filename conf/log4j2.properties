# Quieter local Spark logs. Used only in local mode (see panelcast/spark.py).
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

# On Windows, Hadoop warns that winutils.exe is missing. PanelCast avoids every code path that
# needs it (see BareLocalFileSystem in panelcast/spark.py), so the warning is noise.
logger.shell.name = org.apache.hadoop.util.Shell
logger.shell.level = error
logger.native.name = org.apache.hadoop.util.NativeCodeLoader
logger.native.level = error
logger.ivy.name = org.apache.spark.deploy.SparkSubmitUtils
logger.ivy.level = error
