  COST: {ratio: 0.72, drift: 0.000,  wobble: 0.008, ticket: 118.0, sigma: 0.70, profile: club,            dow: retail,     mix: {COSTCO: 1.0}}
  HD:   {ratio: 0.82, drift: -0.005, wobble: 0.012, ticket: 86.0, sigma: 0.85, profile: home_improvement, dow: weekend,    mix: {HOME DEPOT: 1.0}}
  LOW:  {ratio: 0.92, drift: 0.000,  wobble: 0.012, ticket: 80.0, sigma: 0.85, profile: home_improvement, dow: weekend,    mix: {LOWES: 1.0}}
  DG:   {ratio: 0.98, drift: 0.000,  wobble: 0.008, ticket: 17.0, sigma: 0.60, profile: dollar,           dow: retail,     mix: {DOLLAR GENERAL: 1.0}}
  TJX:  {ratio: 0.62, drift: 0.000,  wobble: 0.012, ticket: 46.0, sigma: 0.65, profile: off_price,        dow: weekend,
