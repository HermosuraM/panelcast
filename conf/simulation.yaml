# Card-visible spend = revenue * ratio(t); ratio drifts by `drift` per year plus a persistent AR(1) wobble
# (`wobble` = stdev of the quarterly innovation). This is the part of revenue a card panel cannot see.
tickers:
  SBUX: {ratio: 0.70, drift: -0.005, wobble: 0.012, ticket: 7.5,  sigma: 0.45, profile: coffee,           dow: coffee,     mix: {STARBUCKS: 1.0}}
  CMG:  {ratio: 0.95, drift: 0.000,  wobble: 0.008, ticket: 14.0, sigma: 0.40, profile: fast_casual,      dow: restaurant, mix: {CHIPOTLE: 1.0}}
  MCD:  {ratio: 1.60, drift: -0.010, wobble: 0.012, ticket: 11.0, sigma: 0.50, profile: qsr,              dow: restaurant, mix: {MCDONALDS: 1.0}}
  YUM:  {ratio: 1.20, drift: 0.000,  wobble: 0.015, ticket: 13.0, sigma: 0.50, profile: qsr,              dow: restaurant,
         mix: {TACO BELL: 0.55, KFC: 0.20, PIZZA HUT: 0.20, THE HABIT: 0.05}}
