# The synthetic world behind the card panel. Everything here is made up EXCEPT the revenue anchor:
# each company's daily "card-visible spend" is interpolated from its REAL quarterly revenue (SEC EDGAR),
# scaled by a slowly drifting visibility ratio (US consumer share, franchise/system sales, take rates...).
# The pipeline never reads this file; evaluation code compares pipeline output with the ground truth
# the simulator writes to the `sim_truth` layer.

start_date: 2018-01-01
end_date: 2026-06-30
population: 260000000            # adults represented by the "census" margins
backfill_until: 2026-03-31       # history arrives as monthly backfill files; later days as daily files

panel:
  n_panelists: 10000             # members ever enrolled (scale knob; ~25M transactions at the default)
  activity_multiplier: 2.0       # each member stands in for this many people (cuts sampling noise cheaply)
  mean_tenure_years: 4.0         # individual churn
  heterogeneity_shape: 0.6       # gamma shape of member-level loyalty (mean 1; smaller = more dispersed)

posting_lag_probs: [0.25, 0.45, 0.20, 0.10]   # P(post_date - txn_date = 0,1,2,3 days)
refund_rate: 0.012

demographics:
  age: {labels: ["18-34", "35-54", "55+"], population: [0.30, 0.33, 0.37]}
  income: {labels: ["<50K", "50-100K", "100K+"], population: [0.38, 0.30, 0.32]}
  region: {labels: [NE, MW, S, W], population: [0.17, 0.21, 0.38, 0.24]}

# Data contributors (banks / card issuers / fintechs). Each skews demographically and formats descriptors
# its own way. Composition shifts over time are exactly what panel normalization + raking must undo.
sources:
  - {id: SRC_A, share: 0.28, onboard: [2018-01-01, 2018-02-28], trickle: 0.35, format: classic,
     age: [0.18, 0.37, 0.45], income: [0.22, 0.33, 0.45], region: [0.30, 0.20, 0.25, 0.25]}
  - {id: SRC_B, share: 0.20, onboard: [2018-01-01, 2018-06-30], trickle: 0.35, format: pos_prefix,
     age: [0.58, 0.30, 0.12], income: [0.45, 0.35, 0.20], region: [0.15, 0.15, 0.30, 0.40]}
  - {id: SRC_C, share: 0.17, onboard: [2019-07-01, 2019-12-31], trickle: 0.30, format: titlecase_short,
     age: [0.25, 0.33, 0.42], income: [0.55, 0.30, 0.15], region: [0.05, 0.10, 0.80, 0.05]}
  - {id: SRC_D, share: 0.22, onboard: [2021-03-01, 2021-08-31], trickle: 0.25, format: debit_purchase,
     age: [0.45, 0.40, 0.15], income: [0.30, 0.45, 0.25], region: [0.15, 0.45, 0.25, 0.15]}
  - {id: SRC_E, share: 0.13, onboard: [2023-01-01, 2023-06-30], trickle: 0.30, format: online_ref,
     age: [0.20, 0.50, 0.30], income: [0.15, 0.30, 0.55], region: [0.40, 0.10, 0.15, 0.35]}

