# Real-world reference data an alt-data analyst curates. Nothing in this file is synthetic.
#
# companies[].brands[] feed two things:
#   * entity resolution: `aliases` are the canonical strings we match noisy card descriptors against,
#     `mcc` lists merchant category codes the brand legitimately transacts under;
#   * the effective-dated brand -> ticker ownership table (`valid_from` / `valid_to`), so spend at an
#     acquired chain only counts toward the parent after the deal closes.
#     The Habit -> YUM, 2020-03-18: https://investors.yum.com/news-events/financial-releases/news-details/2020/Yum-Brands-Completes-Acquisition-of-The-Habit-Restaurants-Inc/default.aspx
#     Ruth's Chris -> DRI, 2023-06-14: https://investor.darden.com/news/news-details/2023/Darden-Restaurants-Completes-Acquisition-of-Ruths-Hospitality-Group/default.aspx
#     Chuy's -> DRI, 2024-10-11: https://investor.darden.com/news/news-details/2024/Darden-Restaurants-Completes-Acquisition-of-Chuys-Holdings-Inc/default.aspx
#
# `wiki` lists English Wikipedia articles used by the pageview alt-data asset (redirects are resolved at fetch time).

revenue_concepts:   # XBRL concepts tried in priority order when building quarterly revenue
  - Revenues
  - RevenueFromContractWithCustomerExcludingAssessedTax
  - RevenueFromContractWithCustomerIncludingAssessedTax
  - SalesRevenueNet
  - SalesRevenueGoodsNet

